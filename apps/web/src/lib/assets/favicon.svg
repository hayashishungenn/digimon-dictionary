<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <title>DigiDex — 数码宝贝全图鉴</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16203a"/>
      <stop offset="1" stop-color="#0a0e1a"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="url(#bg)" stroke="#2e4377" stroke-width="2"/>
  <!-- terminal scan grid -->
  <g stroke="#22325a" stroke-width="1" opacity="0.7">
    <path d="M14 22h20M14 30h20M14 38h20" fill="none"/>
    <path d="M20 16v22M28 16v22" fill="none"/>
  </g>
  <!-- digivice-style diamond (screen) -->
  <path d="M32 12 L48 26 L32 52 L16 26 Z" fill="none" stroke="#35d0ff" stroke-width="2.5" opacity="0.95"/>
  <path d="M32 18 L42 26 L32 46 L22 26 Z" fill="none" stroke="#35d0ff" stroke-width="1.2" opacity="0.5"/>
  <!-- center core -->
  <circle cx="32" cy="27" r="4.5" fill="#35d0ff"/>
  <circle cx="32" cy="27" r="2" fill="#0a0e1a"/>
</svg>
