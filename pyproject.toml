[project]
name = "digidex"
version = "0.1.0"
description = "Digimon Complete Dex — canonical knowledge base & web encyclopedia"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "opencc-python-reimplemented>=0.1.7",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
sync-data = "scripts.sync_data:main"
download-images = "scripts.download_images:main"
validate-data = "scripts.validate_data:main"
export-dataset = "scripts.export_dataset:main"
verify-samples = "scripts.verify_samples:main"
backup-local = "scripts.backup_local:main"
restore-local = "scripts.restore_local:main"
inspect-snapshot = "scripts.inspect_snapshot:main"
review-queue = "scripts.review_queue:main"
diagnose = "scripts.diagnose:main"
migrate-image-paths = "scripts.migrate_image_paths:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "apps"]
